blueprint:
  name: SolarEdge open alert notification
  description: >-
    Sends a notification when the SolarEdge Open alerts sensor rises above zero,
    so an inverter, meter, or battery fault reported by the monitoring platform
    is seen the same day.
  domain: automation
  source_url: https://github.com/trooperthorn/ha_int_solaredge/blob/main/blueprints/automation/solaredge_open_alert_notify.yaml
  input:
    alerts_sensor:
      name: Open alerts sensor
      selector:
        entity:
          integration: solaredge_v2
          domain: sensor
    notify_action:
      name: Notification action
      description: The notify action to call, for example notify.mobile_app_phone.
      selector:
        text:

triggers:
  - trigger: numeric_state
    entity_id: !input alerts_sensor
    above: 0

actions:
  - action: !input notify_action
    data:
      title: SolarEdge alert
      message: >-
        SolarEdge reports {{ trigger.to_state.state }} open alert(s).
        Check the monitoring portal for the affected component.
